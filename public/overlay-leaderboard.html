<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard Overlay</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent !important;
      font-family: 'Segoe UI', sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #leaderboard {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 20, 0.85);
      border-radius: 14px;
      padding: 14px 18px;
      min-width: 260px;
      max-width: 400px;
      width: 90%;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    #leaderboard h3 {
      font-size: 0.72rem;
      color: #00e5ff;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    #lb-list { list-style: none; }
    #lb-list li {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.83rem;
      color: #f0f0f0;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    #lb-list li:last-child { border-bottom: none; }

    .lb-rank { color: #666; width: 18px; font-size: 0.75rem; }
    .lb-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lb-xp { color: #ffd740; font-weight: bold; font-size: 0.8rem; }

    /* Top 3 gold/silver/bronze */
    li:nth-child(1) .lb-rank { color: #ffd740; font-weight: bold; }
    li:nth-child(2) .lb-rank { color: #c0c0c0; font-weight: bold; }
    li:nth-child(3) .lb-rank { color: #cd7f32; font-weight: bold; }
  </style>
</head>
<body>

<div id="leaderboard">
  <h3>🏆 Top Players</h3>
  <ul id="lb-list"></ul>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const teamColors = { A:'#ff5252', B:'#448aff', C:'#69f0ae' };

  socket.on('game:state', ({ leaderboard }) => {
    const list = document.getElementById('lb-list');
    list.innerHTML = leaderboard.slice(0, 8).map((p, i) => `
      <li>
        <span class="lb-rank">${i + 1}.</span>
        <span class="lb-name" style="color:${teamColors[p.team] || '#f0f0f0'}">${p.nickname || p.username}</span>
        <span class="lb-xp">${p.total_xp} XP</span>
      </li>
    `).join('');
  });
</script>
</body>
</html>
