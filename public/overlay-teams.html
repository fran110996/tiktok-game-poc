<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams Overlay — TikTok LIVE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: transparent !important;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    #teams {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      padding: 14px 10px;
      width: 100%;
      max-width: 100%;
    }

    .team-pill {
      background: rgba(10, 12, 24, 0.94);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 1.35rem;
      font-weight: 800;
      text-align: center;
      flex: 1;
      max-width: 180px;
      min-width: 90px;
      border: 3px solid rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      color: #fff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .team-pill span { 
      display: block; 
      font-size: 0.72rem; 
      opacity: 0.85; 
      margin-bottom: 2px; 
      letter-spacing: 1px; 
      text-transform: uppercase; 
      white-space: nowrap;
    }
    .team-pill strong {
      display: block;
      font-size: 1.4rem;
      line-height: 1.1;
    }
    .team-pill small {
      display: block;
      font-size: 0.65rem;
      opacity: 0.7;
    }

    .team-A { border-color: #ff1744; box-shadow: 0 0 16px rgba(255, 23, 68, 0.35); }
    .team-A strong { color: #ff5252; }
    .team-B { border-color: #2979ff; box-shadow: 0 0 16px rgba(41, 121, 255, 0.35); }
    .team-B strong { color: #448aff; }
    .team-C { border-color: #00e676; box-shadow: 0 0 16px rgba(0, 230, 118, 0.35); }
    .team-C strong { color: #69f0ae; }

    .toast-area {
      position: fixed;
      bottom: 20px;
      left: 16px;
      right: 16px;
      display: flex;
      flex-direction: column-reverse;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      background: rgba(10, 12, 24, 0.94);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fff;
      max-width: 360px;
      animation: fadeIn 0.3s ease;
      border-left: 4px solid #ea00ff;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .toast.gift { border-color: #ffd740; }
    .toast.join { border-color: #00e676; }
    @keyframes fadeIn {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
  </style>
</head>
<body>

<div id="teams">
  <div class="team-pill team-A"><span>Team A</span><strong id="score-A">0</strong><small>XP</small></div>
  <div class="team-pill team-B"><span>Team B</span><strong id="score-B">0</strong><small>XP</small></div>
  <div class="team-pill team-C"><span>Team C</span><strong id="score-C">0</strong><small>XP</small></div>
</div>

<div class="toast-area" id="toasts"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  function updateTeamScores(teamScores) {
    if (!teamScores) return;
    document.getElementById('score-A').textContent = teamScores.A || 0;
    document.getElementById('score-B').textContent = teamScores.B || 0;
    document.getElementById('score-C').textContent = teamScores.C || 0;
  }

  // 1. Initial fetch from DB
  fetch('/api/teams')
    .then(r => r.json())
    .then(scores => updateTeamScores(scores))
    .catch(err => console.error('Error fetching initial team scores:', err));

  // 2. Real-time updates
  socket.on('game:state', ({ teamScores }) => {
    updateTeamScores(teamScores);
  });

  function toast(text, type, ms = 4000) {
    const area = document.getElementById('toasts');
    const d = document.createElement('div');
    d.className = `toast ${type}`;
    d.textContent = text;
    area.prepend(d);
    if (area.children.length > 4) area.removeChild(area.lastChild);
    setTimeout(() => d.remove(), ms);
  }

  socket.on('player:team_assigned', ({ nickname, team }) => toast(`🏳️ ${nickname} joined Team ${team}!`, 'team'));
  socket.on('game:gift', ({ nickname, giftName }) => toast(`🎁 ${nickname} sent ${giftName}!`, 'gift'));
  socket.on('game:join', ({ nickname }) => toast(`👤 ${nickname} joined the stream`, 'join', 2500));
</script>
</body>
</html>
